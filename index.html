<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>English Coach</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg:#0f1115; --card:#1a1d24; --card2:#232733; --tx:#e8eaed; --mut:#9aa0a6;
    --acc:#60a5fa; --acc2:#a78bfa; --ok:#4ade80; --err:#f87171; --warn:#fbbf24;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden] { display:none !important; }
  html, body { margin:0; background:var(--bg); color:var(--tx); font:16px/1.5 system-ui, -apple-system, sans-serif; }
  body { padding:16px 16px calc(16px + env(safe-area-inset-bottom)); max-width:560px; margin:0 auto; }
  h1 { font-size:22px; margin:0; }
  h2 { font-size:16px; margin:0 0 10px; }
  .screen { display:none; }
  .screen.on { display:block; }
  .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; gap:8px; }
  .icon-btn { background:var(--card); border:none; color:var(--tx); width:42px; height:42px; border-radius:12px; font-size:20px; }
  .card { background:var(--card); border-radius:16px; padding:16px; margin-bottom:12px; }
  .muted { color:var(--mut); font-size:14px; }
  .small { font-size:13px; }
  .row { display:flex; gap:10px; align-items:center; }
  .grow { flex:1; }
  label { display:block; font-size:14px; color:var(--mut); margin:12px 0 4px; }
  input, select, textarea {
    width:100%; font:inherit; color:var(--tx); background:var(--card2); border:1px solid #333a48;
    border-radius:10px; padding:11px 12px;
  }
  button.btn {
    width:100%; font:inherit; font-weight:600; border:none; border-radius:12px; padding:14px;
    background:var(--acc); color:#0b1220; margin-top:10px;
  }
  button.btn.alt { background:var(--card2); color:var(--tx); }
  button.btn.danger { background:var(--err); color:#1a0b0b; }
  button:disabled { opacity:.45; }
  .ok { color:var(--ok); } .err { color:var(--err); } .warn { color:var(--warn); }

  /* Home */
  .streak { display:flex; align-items:center; gap:14px; }
  .flame { font-size:42px; line-height:1; }
  .big { font-size:30px; font-weight:700; line-height:1.1; }
  .bar { height:8px; background:var(--card2); border-radius:8px; overflow:hidden; margin-top:10px; }
  .bar > div { height:100%; background:linear-gradient(90deg, var(--acc), var(--acc2)); width:0; transition:width .4s; }
  .week { display:flex; justify-content:space-between; margin-top:12px; }
  .day { text-align:center; font-size:12px; color:var(--mut); width:36px; }
  .dot { width:28px; height:28px; border-radius:50%; background:var(--card2); margin:4px auto 0; display:flex; align-items:center; justify-content:center; font-size:13px; }
  .dot.done { background:var(--acc); color:#0b1220; }
  .dot.today { outline:2px solid var(--acc2); }
  .modes { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .mode { background:var(--card2); border:2px solid transparent; border-radius:14px; padding:14px 12px; text-align:left; color:var(--tx); font:inherit; }
  .mode b { display:block; font-size:15px; margin-top:6px; }
  .mode span { font-size:13px; color:var(--mut); }
  .mode .emo { font-size:26px; }
  .hist-item { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-top:1px solid #2a2f3a; gap:10px; }
  .hist-item:first-of-type { border-top:none; }
  .pill { font-size:12px; padding:2px 8px; border-radius:20px; background:var(--card2); color:var(--mut); white-space:nowrap; }

  /* Session */
  .orb-wrap { display:flex; flex-direction:column; align-items:center; padding:18px 0 8px; }
  .orb {
    width:140px; height:140px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #93c5fd, var(--acc) 45%, #3b3f9e 100%);
    box-shadow:0 0 40px rgba(96,165,250,.35); transition:transform .08s linear, box-shadow .3s;
  }
  .orb.speaking { background:radial-gradient(circle at 35% 30%, #ddd6fe, var(--acc2) 45%, #4c1d95 100%); box-shadow:0 0 50px rgba(167,139,250,.5); }
  .orb.idle { filter:grayscale(.7) brightness(.7); }
  #status { margin-top:14px; font-weight:600; }
  #timer { color:var(--mut); font-size:14px; }
  #transcript { max-height:38vh; overflow-y:auto; margin-top:8px; }
  .line { padding:8px 12px; border-radius:12px; margin:6px 0; white-space:pre-wrap; font-size:15px; }
  .line.user { background:#1e3a5f; margin-left:28px; }
  .line.ai { background:var(--card2); margin-right:28px; }
  .line.sys { background:transparent; color:var(--warn); font-size:13px; text-align:center; }
  .controls { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  #talk { font-size:18px; padding:18px; }
  #talk.rec { background:var(--err); color:#1a0b0b; }

  /* Review */
  .corr { background:var(--card2); border-radius:12px; padding:12px; margin-top:10px; }
  .corr .diff { font-size:15px; }
  .corr .why { color:var(--mut); font-size:14px; margin-top:6px; }
  s.del { color:var(--err); }
  b.add { color:var(--ok); }
  .vocab { display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  .vocab div { background:var(--card2); border-radius:10px; padding:8px 10px; font-size:14px; }
  details summary { cursor:pointer; color:var(--mut); }
  .spinner { width:28px; height:28px; border:3px solid var(--card2); border-top-color:var(--acc); border-radius:50%; animation:spin 1s linear infinite; margin:16px auto; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<!-- ================= HOME ================= -->
<section id="home" class="screen">
  <div class="top">
    <h1>English Coach</h1>
    <button class="icon-btn" data-go="settings" aria-label="Ajustes">⚙️</button>
  </div>

  <div class="card">
    <div class="streak">
      <div class="flame">🔥</div>
      <div class="grow">
        <div class="big" id="streak">0 días</div>
        <div class="muted" id="today-min">Hoy: 0 de 10 min</div>
      </div>
    </div>
    <div class="bar"><div id="goal-bar"></div></div>
    <div class="week" id="week"></div>
  </div>

  <div class="card">
    <h2>Practicar</h2>
    <div class="modes">
      <button class="mode" data-start="free"><div class="emo">💬</div><b>Conversación</b><span>Charla libre</span></button>
      <button class="mode" data-start="interview"><div class="emo">💼</div><b>Entrevista</b><span>Técnica, en inglés</span></button>
    </div>
    <div class="row" style="margin-top:4px">
      <div class="grow">
        <label for="level">Nivel</label>
        <select id="level">
          <option value="A2">A2 — Básico</option>
          <option value="B1">B1 — Intermedio</option>
          <option value="B2">B2 — Intermedio alto</option>
          <option value="C1">C1 — Avanzado</option>
        </select>
      </div>
    </div>
    <label for="topic">Tema (opcional)</label>
    <input id="topic" placeholder="Ej: mi fin de semana, Docker, mi último proyecto…">
    <div class="muted small" id="mode-hint" style="margin-top:10px"></div>
  </div>

  <div class="card">
    <h2>Últimas sesiones</h2>
    <div id="history"><div class="muted">Todavía no hay sesiones.</div></div>
  </div>
</section>

<!-- ================= SETTINGS ================= -->
<section id="settings" class="screen">
  <div class="top">
    <h1>Ajustes</h1>
    <button class="icon-btn" data-go="home" aria-label="Volver">✕</button>
  </div>
  <div class="card">
    <h2>API key de Gemini</h2>
    <div class="muted small">Se guarda solo en este celular. Creala gratis en <b>aistudio.google.com/apikey</b>.</div>
    <label for="apikey">API key</label>
    <input id="apikey" type="password" autocomplete="off" placeholder="AIza…">
    <button class="btn" id="verify">Guardar y detectar modelos</button>
    <div class="small" id="verify-msg" style="margin-top:8px"></div>
  </div>
  <div class="card">
    <h2>Modelos</h2>
    <label for="live-model">Voz en tiempo real (Live)</label>
    <select id="live-model"></select>
    <label for="lite-model">Texto (modo turnos y análisis)</label>
    <select id="lite-model"></select>
    <label for="voice">Voz de la IA (solo Live)</label>
    <select id="voice">
      <option value="">Predeterminada</option>
      <option>Kore</option><option>Puck</option><option>Aoede</option>
      <option>Charon</option><option>Fenrir</option><option>Leda</option>
    </select>
    <label for="mode">Modo de conversación</label>
    <select id="mode">
      <option value="auto">Automático (Live; si falla, turnos)</option>
      <option value="live">Solo Live</option>
      <option value="turns">Solo turnos</option>
    </select>
  </div>
  <div class="card">
    <h2>Perfil</h2>
    <label for="name">Tu nombre</label>
    <input id="name">
    <label for="role">Puesto para las entrevistas</label>
    <textarea id="role" rows="2"></textarea>
    <label for="goal">Meta diaria (minutos)</label>
    <input id="goal" type="number" min="1" max="120">
    <button class="btn" id="save-settings">Guardar</button>
  </div>
</section>

<!-- ================= SESSION ================= -->
<section id="session" class="screen">
  <div class="top">
    <div>
      <h1 id="s-title">Conversación</h1>
      <div id="timer">00:00 · <span id="s-mode">conectando…</span></div>
    </div>
  </div>
  <div class="orb-wrap">
    <div class="orb idle" id="orb"></div>
    <div id="status">Conectando…</div>
  </div>
  <div class="card" style="padding:10px 12px">
    <div id="transcript"></div>
  </div>
  <div id="live-controls" class="controls" hidden>
    <button class="btn alt" id="mute">🎙️ Silenciar</button>
    <button class="btn danger" id="end-live">Terminar</button>
  </div>
  <div id="turn-controls" hidden>
    <button class="btn" id="talk">🎙️ Tocá para hablar</button>
    <div class="row" style="margin-top:10px">
      <input id="type-input" class="grow" placeholder="…o escribí en inglés">
      <button class="icon-btn" id="type-send" style="flex:none">➤</button>
    </div>
    <button class="btn danger" id="end-turns">Terminar</button>
  </div>
  <div id="fallback-box" hidden>
    <button class="btn" id="to-turns">Seguir en modo turnos</button>
    <button class="btn alt" id="end-fallback">Terminar y analizar</button>
  </div>
</section>

<!-- ================= REVIEW ================= -->
<section id="review" class="screen">
  <div class="top">
    <h1>Resumen</h1>
    <button class="icon-btn" data-go="home" aria-label="Volver">✕</button>
  </div>
  <div id="review-body"></div>
</section>

<script type="module" src="app.js"></script>
</body>
</html>
